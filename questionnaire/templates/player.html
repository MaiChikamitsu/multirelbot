<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自動停止プレーヤー</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/player.css"><script src="/static/player.js" defer></script></head>
<body><main><header><h1>自動停止プレーヤー</h1><p>前のアンケートと同じ時刻で自動停止します。続きは「次の区間を再生」を押してください。</p></header>
<section><label for="theme">動画</label><select id="theme"></select><h2 id="segment">読み込み中…</h2><video id="video" playsinline preload="metadata"></video><div class="volume-control"><label for="volume-boost">音量 <output id="volume-value" for="volume-boost">1.0倍</output></label><input id="volume-boost" type="range" min="1" max="5" step="0.1" value="1" aria-describedby="volume-hint"><small id="volume-hint">音が割れる場合は、倍率を下げてください。</small></div><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="play" disabled>再生</button><button id="repeat" class="quiet" disabled>この区間を最初から</button><button id="restart" class="quiet" disabled>最初から</button></div></section></main></body></html>
